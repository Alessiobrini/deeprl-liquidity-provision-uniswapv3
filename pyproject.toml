[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deeprl-liquidity-provision-uniswapv3"
version = "0.2.0"
description = "Reinforcement learning for active liquidity provision in Uniswap v3"
requires-python = ">=3.11"
# Versions are pinned here and in environment.yml. rl-code/requirements.txt pinned
# nothing, and the stable-baselines3 API moves fast enough that this alone may explain
# why the previous paper's results did not reproduce.
dependencies = [
    "numpy>=2.4,<3",
    "pandas>=3.0,<4",
    "scipy>=1.17,<2",
    "matplotlib>=3.10,<4",
    "pyarrow>=25,<26",
    "torch==2.12.1",
    "stable-baselines3==2.9.0",
    "sb3-contrib==2.9.0",
    "gymnasium==1.3.0",
    # TA-Lib is a HARD import in envs/features.py, so it is declared here rather than
    # left to environment.yml. The pip wrapper still needs the C library underneath it:
    # `conda install -c conda-forge ta-lib` (what environment.yml does) or
    # `brew install ta-lib` FIRST, then this resolves. Without the C library this line
    # fails loudly at install time, which is better than the package failing to import
    # at runtime with pip reporting success.
    "TA-Lib>=0.6,<0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
